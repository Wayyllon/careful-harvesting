plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

// Server game tests live in src/gametest (a separate dev-only mod, not shipped in the jar)
// and run the loader-independent cases from common/src/gametest.
sourceSets {
    gametest {
        java.srcDir(rootProject.file('common/src/gametest/java'))
        resources.srcDir(rootProject.file('common/src/gametest/resources'))
    }
}

dependencies {
    gametestImplementation(sourceSets.main.output)
    // Plain JUnit test that the client-only classes load (see src/test).
    testImplementation(platform("org.junit:junit-bom:${junit_version}"))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}
tasks.named('test', Test) {
    useJUnitPlatform()
}

neoForge {
    version = neoforge_version
    addModdingDependenciesTo(sourceSets.gametest)
    addModdingDependenciesTo(sourceSets.test)
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "${mod_id}_gametest" {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
            loadedMods = [mods.named(mod_id).get()]
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            loadedMods = [mods.named(mod_id).get()]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = project.file('runs/gametest')
            loadedMods = [mods.named(mod_id).get(), mods.named("${mod_id}_gametest").get()]
            // JUnit-style XML report of the game test results.
            programArgument('--report')
            programArgument(project.layout.buildDirectory.file('reports/gametest/TEST-gametest.xml').get().asFile.absolutePath)
        }
    }
}

// Run the game tests as part of `check` (and so `build`). The game test server exits
// with the number of failed required tests; additionally make sure tests actually ran.
def gameTestLog = project.file('runs/gametest/logs/latest.log')
def gameTestReportDir = project.layout.buildDirectory.dir('reports/gametest').get().asFile
tasks.named('runGameTestServer') {
    doFirst {
        gameTestLog.delete()
        gameTestReportDir.mkdirs()
    }
    doLast {
        def matcher = gameTestLog.exists() ? (gameTestLog.text =~ /All (\d+) required tests passed/) : null
        if (matcher == null || !matcher.find() || matcher.group(1).toInteger() == 0) {
            throw new GradleException("NeoForge game tests did not report any passed tests; see ${gameTestLog}")
        }
        println("NeoForge game tests: ${matcher.group(1)} passed")
    }
}
tasks.named('check') {
    dependsOn('runGameTestServer')
}

// mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'neoforge')
            }
        }
    }
}
